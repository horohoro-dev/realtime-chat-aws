# 開発者の PC で使う PostgreSQL。接続情報は CI のサービスコンテナ（.github/workflows/ci.yml）と同じ固定値。
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 10

volumes:
  postgres-data:
