# changes で変更のあった側を判定し、要るジョブだけを動かす。main と develop のブランチ保護の必須チェックは ci-result だけにする。
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/ecspresso/**'
              - 'api/openapi.yaml'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'api/openapi.yaml'
              - '.github/workflows/ci.yml'

  backend-lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          # テスト専用の固定値。公開されても困らないので Secrets に置かない
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -n auto --junitxml=test-results/pytest-junit.xml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  backend-schema:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python manage.py spectacular --file ../api/openapi.yaml --validate --fail-on-warn
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      # 差分があれば、コードを変えたのに make api で api/openapi.yaml を作り直していない
      - run: git diff --exit-code -- ../api/openapi.yaml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: frontend (${{ matrix.task }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # 1つが失敗しても、ほかの検査の結果も最後まで出す
      fail-fast: false
      matrix:
        include:
          - { task: lint,      timeout: 10, run: "pnpm run lint" }
          # check:api は、api/openapi.yaml から作り直した型が、コミットされた schema.d.ts と同じかを確かめる
          - { task: typecheck, timeout: 10, run: "pnpm run check:api && pnpm exec tsc --noEmit" }
          - { task: test,      timeout: 15, run: "pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=test-results/vitest-junit.xml" }
          - { task: build,     timeout: 10, run: "pnpm exec vite build" }
          # ビルドした画面を vite preview で配信し、Chromium で動かす（frontend/playwright.config.ts）
          - { task: e2e,       timeout: 20, run: "pnpm exec playwright install --with-deps chromium && pnpm run e2e" }
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (matrix.task == 'test' || matrix.task == 'e2e')
        with:
          name: frontend-${{ matrix.task }}-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  security-scan:
    # シークレットはどのファイルにも入りうるので、変更の場所にかかわらず毎回動かす
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 2026年3月に trivy-action と setup-trivy のタグが書き換えられた（CVE-2026-33634）。
      # v0.36.0 はその後の immutable なリリースで、中の setup-trivy も安全な v0.2.6 にハッシュで固定されている
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Trivy は既定で開発用の依存（devDependencies、uv の dev グループ）を外す。
          # Vite などは CI で動き、本番の JavaScript も作るので含める
          TRIVY_INCLUDE_DEV_DEPS: "true"
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          # misconfig は Dockerfile と Terraform などの設定ミスを見る
          scanners: vuln,secret,misconfig
          format: json
          output: trivy-results.json
          # 判定は後のステップで行うので、ここでは見つかっても止めない
          exit-code: "0"
      - name: ジョブの概要に結果の表を出す
        if: always() && hashFiles('trivy-results.json') != ''
        run: jq -r -f .github/scripts/trivy-summary.jq trivy-results.json >> "$GITHUB_STEP_SUMMARY"
      - name: 表の形式の結果を作る
        if: always() && hashFiles('trivy-results.json') != ''
        # --scanners がないと深刻度ごとの件数の表が出ず、脆弱性が0件のときは空のファイルになる
        run: trivy convert --format table --scanners vuln,secret,misconfig --output trivy-results.txt trivy-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && hashFiles('trivy-results.json') != ''
        with:
          name: trivy-results
          path: |
            trivy-results.json
            trivy-results.txt
          retention-days: 14
      - name: 脆弱性、シークレット、設定ミスがあれば失敗にする
        run: |
          vulns=$(jq '[.Results[]?.Vulnerabilities[]? | select((.Severity == "CRITICAL" or .Severity == "HIGH") and (.FixedVersion // "") != "")] | length' trivy-results.json)
          secrets=$(jq '[.Results[]?.Secrets[]?] | length' trivy-results.json)
          misconfigs=$(jq '[.Results[]?.Misconfigurations[]? | select(.Status == "FAIL" and (.Severity == "CRITICAL" or .Severity == "HIGH"))] | length' trivy-results.json)
          failed=0
          if [ "$vulns" -gt 0 ]; then
            echo "::error::修正版のある CRITICAL と HIGH の脆弱性が ${vulns} 件あります"
            failed=1
          fi
          if [ "$secrets" -gt 0 ]; then
            echo "::error::シークレットが ${secrets} 件見つかりました。コミットから消し、値を無効にしてください"
            failed=1
          fi
          if [ "$misconfigs" -gt 0 ]; then
            echo "::error::CRITICAL と HIGH の設定ミスが ${misconfigs} 件あります"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::ジョブの概要の表を見てください"
            exit 1
          fi

  # main と develop のブランチ保護の必須チェックはこのジョブだけ。if で飛ばしたジョブは skipped になり、失敗に数えない
  ci-result:
    needs:
      - changes
      - backend-lint
      - backend-test
      - backend-schema
      - frontend
      - security-scan
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
